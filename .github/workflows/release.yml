# Public releases, one per pushed tag v<X.Y.Z>. Development happens on a private GitLab;
# scripts/publish-github.sh brings it here as one squashed commit per publish, and with --tag puts
# the tag on that public commit. A push to main alone only runs ci.yml.
#
# The version is the tag's, and packaging/gh-build.sh refuses a tag that does not match the version
# in Cargo.toml: scripts/release.sh bumps both and tags in one go. The release notes are the
# annotated tag's message. The build polls the public feed, this repository's
# `releases/latest/download/latest.json`, which is why every release is marked latest and carries
# latest.json next to the RPM.
#
# Two jobs, so the token that can write never meets the build: `build` (contents: read) compiles
# the tag, and with it every dependency's build script, and hands the RPM and latest.json on as an
# artifact; `publish` (contents: write) runs no code of this repository, built or not, on a fresh
# runner: it checks the artifact (the tag's version, the URL the release serves, the RPM's sha256
# against latest.json) and creates the release with gh.
#
# lmgw's crates come from the public lmgw at the release LMGW_PIN names (lmgw_tag), cloned next to
# this checkout; the build refuses it unless its tree is the pinned tree (scripts/lmgw-pin.sh
# verify-tree), so the tag must be published before Kai's release that names it.
name: Release

on:
  push:
    tags: ["v*"]

# Each job names what it needs.
permissions: {}

# One release at a time and never cancelled half-way: a newer push waits for the running one
# (GitHub keeps only the newest pending run).
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    # Not in forks: their builds would still poll this repository's feed.
    if: github.repository == 'lmgw-dev/kai'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Current Fedora, as on GitLab, so the RPM's GTK, WebKitGTK, gtk-layer-shell and PipeWire
    # SONAME dependencies match the hosts it is installed on.
    container:
      image: fedora:latest
    # A cold release build (thin LTO) from scratch; this bounds what a hung build can cost.
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      # git for a real clone; jq to read the manifest.
      - name: Install checkout tools
        run: dnf -y install git-core jq
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # As in ci.yml (GITHUB_ENV, because `github.workspace` is the host path).
      - name: Keep the cargo home in the workspace
        run: |
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.cargo/bin" >> "$GITHUB_PATH"

      # No cache: one saved here would belong to this tag, and no other run can read a tag's cache,
      # so every release downloads and compiles from scratch. The spec's build dependencies as
      # .gitlab-ci.yml installs them; trunk, wasm-bindgen and wasm-opt pinned and hash-checked.
      - name: Install build dependencies
        run: |
          dnf -y install rpm-build rpmlint desktop-file-utils rust cargo gcc gcc-c++ make \
            pkgconf-pkg-config clang clang-devel gtk3-devel webkit2gtk4.1-devel libsoup3-devel \
            gtk-layer-shell-devel pipewire-devel wayland-devel tar gzip \
            rust-std-static-wasm32-unknown-unknown curl
          bash packaging/install-trunk.sh /usr/local/bin
          bash packaging/install-wasm-tools.sh /usr/local/bin

      - name: lmgw at the pinned release, next to the checkout
        run: |
          git clone --quiet --depth 1 --branch "$(bash scripts/lmgw-pin.sh tag)" \
            https://github.com/lmgw-dev/lmgw.git ../lmgw
          bash scripts/lmgw-pin.sh verify-tree ../lmgw

      # Refuses a tag that is not the version in Cargo.toml.
      - name: Build the RPM and latest.json
        run: bash packaging/gh-build.sh

      # Advisory, as on GitLab: rpmlint's verdict is in the log, it does not hold up the release.
      - name: rpmlint
        run: rpmlint target/rpm/dist/kai-*.rpm || true

      # Exactly the RPM latest.json names and latest.json itself; publish checks them again.
      - name: Stage the release files
        run: |
          rpm="$(jq -er .rpm.file target/rpm/dist/latest.json)"
          mkdir release
          cp "target/rpm/dist/$rpm" target/rpm/dist/latest.json release/
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.repository == 'lmgw-dev/kai'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, upload assets
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    # No checkout and nothing from the build but the two files: this job runs only the steps below,
    # with the runner's own gh, jq and sha256sum.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Check the build against the tag and latest.json
        id: manifest
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || fail "$TAG is no v<X.Y.Z> tag"
          version="${BASH_REMATCH[1]}"
          m=release/latest.json
          [[ -f "$m" ]] || fail "the build handed on no latest.json"
          got="$(jq -er .version "$m")" || fail "latest.json has no version"
          [[ "$got" == "$version" ]] || fail "latest.json says $got, the tag $TAG"
          rpm="$(jq -er .rpm.file "$m")" || fail "latest.json names no RPM"
          [[ "$rpm" =~ ^kai-[0-9A-Za-z._+~-]+\.x86_64\.rpm$ && "$rpm" == "kai-${version}-"* ]] \
            || fail "latest.json names $rpm, not an RPM of kai $version"
          url="$(jq -er .rpm.url "$m")" || fail "latest.json has no RPM URL"
          want="https://github.com/${GH_REPO}/releases/download/${TAG}/${rpm}"
          [[ "$url" == "$want" ]] || fail "latest.json points at $url, but this release serves $want"
          sha="$(jq -er .rpm.sha256 "$m")" || fail "latest.json has no sha256"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || fail "latest.json's sha256 is not 64 hex digits: $sha"
          files="$(cd release && find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          [[ "$files" == "$(printf '%s\n' "$rpm" latest.json | LC_ALL=C sort)" ]] \
            || fail "the build handed on other files than $rpm and latest.json: $files"
          [[ -f "release/$rpm" && ! -L "release/$rpm" ]] || fail "$rpm is not a plain file"
          have="$(sha256sum "release/$rpm" | cut -d' ' -f1)"
          [[ "$have" == "$sha" ]] || fail "$rpm's sha256 is $have, latest.json says $sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rpm=$rpm" >> "$GITHUB_OUTPUT"

      - name: Publish release v${{ steps.manifest.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
          RPM: ${{ steps.manifest.outputs.rpm }}
        run: |
          tag="v${VERSION}"
          dist=release
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run of this tag, so the release (or the draft a failed upload left behind) is
            # already there. Replace the assets: the RPM first, then the manifest that names its
            # sha256.
            gh release upload "$tag" "$dist/${RPM}" --clobber
            gh release upload "$tag" "$dist/latest.json" --clobber
            gh release edit "$tag" --draft=false --latest
          else
            # The notes are the annotated tag's message (asked of the API: this job has no
            # checkout), unwrapped to one line per paragraph: GitHub shows every line break. The
            # program is packaging/unwrap-notes.awk's (scripts/release.sh uses that file), inline
            # here so this job runs nothing from the repository. A lightweight tag gets GitHub's
            # generated notes instead.
            unwrap="$RUNNER_TEMP/unwrap-notes.awk"
            cat > "$unwrap" <<'AWK'
          function flush() {
              if (buf != "") print buf
              buf = ""
          }
          /^[[:space:]]*```/ { flush(); print; fence = !fence; next }
          fence { print; next }
          /^[[:space:]]*$/ { flush(); print ""; next }
          /^[[:space:]]*(#|>|\|)/ { flush(); print; next }
          /^[[:space:]]*([-*+]|[0-9]+[.)])[[:space:]]/ { flush(); buf = $0; next }
          {
              if (buf == "") { buf = $0; next }
              line = $0
              sub(/^[[:space:]]+/, "", line)
              buf = buf " " line
          }
          END { flush() }
          AWK
            ref="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.type + " " + .object.sha')"
            notes=""
            if [[ "$ref" == "tag "* ]]; then
              notes="$(gh api "repos/${GH_REPO}/git/tags/${ref#tag }" --jq .message | awk -f "$unwrap")"
            fi
            if [[ -n "${notes//[[:space:]]/}" ]]; then
              notes_args=(--notes "$notes")
            else
              notes_args=(--generate-notes)
            fi
            # With assets, gh creates a draft, uploads, then publishes: the release never appears
            # without both files.
            gh release create "$tag" "$dist/${RPM}" "$dist/latest.json" \
              --title "Kai ${VERSION}" \
              "${notes_args[@]}" \
              --verify-tag \
              --latest
          fi
