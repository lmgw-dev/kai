<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kai (K9): the voice ring. lmgw's tile and colours: a white ring (lmgw's gate white) with
       lmgw's three lanes as level bars - violet, blue (local, the middle and tallest), teal.
       No clipPath / mask / filter, so Qt and rsvg render it the same. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252B34"/>
      <stop offset="1" stop-color="#14181E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#F4F6F8" stroke-width="92"/>
  <rect x="324" y="420" width="84" height="184" rx="42" fill="#A56EF6"/>
  <rect x="462" y="324" width="100" height="376" rx="50" fill="#3DAEE9"/>
  <rect x="616" y="420" width="84" height="184" rx="42" fill="#2DC9A6"/>
</svg>
